image:
  repository: registry.sberdevices.ru/rndml/text-to-3d/text-to-3d-frontend/text-to-3d-frontend
  tag: "latest"

imagePullSecrets:
  - name: gitlab-registry-secret

serviceAccount:
  create: false

securityContext: {}
podSecurityContext: {}

service:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080

ingress:
  enabled: true
  openshift: true
  route: 
    path: "/"
    annotations: 
      haproxy.router.openshift.io/rewrite-target: /
      openshift.io/host.generated: 'true'  

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http
