server {
    server_tokens off;
    listen 8080;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~ \.js$ {
        root   /usr/share/nginx/html;
        add_header Content-Type application/javascript;
    }

    error_page 500 502 503 504 /50x.html;

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
    }
}
