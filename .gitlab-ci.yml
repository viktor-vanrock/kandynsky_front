include:
  - project: 'rndml-public/devops/job-templates'
    file:
      - '.nodejs-templates.yml'
      - '.deploy.yml'
      - '.security-sast-sca.yml'
      - '.security-dast.yml'
      - '.security-container.yml'
  - '.deploy.yml'

stages:
  - prepare
  - linter
  - test
  - reports
  - build
  - pack
  - dast
  - dast-reports
  - container_test
  - deploy

.rules:
  rules_main:
    - if: $CI_PIPELINE_SOURCE != 'schedule' && $CI_COMMIT_BRANCH == 'master'
    - if: $CI_PIPELINE_SOURCE != 'schedule' && $CI_COMMIT_BRANCH == 'main'
  rules_tag:
    - if: $CI_PIPELINE_SOURCE != 'schedule' && $CI_COMMIT_TAG =~ /(?:\d+\.){2}(?:\d+)$/
  rules_mr:
    - if: $CI_PIPELINE_SOURCE != 'schedule' && $CI_PIPELINE_SOURCE == 'merge_request_event'
  rules_schedule:
    - if: $CI_PIPELINE_SOURCE == 'schedule'

get_version:
  extends: .version
  rules:
    - !reference [.rules, rules_mr]
    - !reference [.rules, rules_main]
    - !reference [.rules, rules_tag]

linter:
  extends: .linter
  image: registry.sberdevices.ru/rndml/devops/dockerfiles/nodejs-base-22:latest
  rules:
    - !reference [.rules, rules_mr]
    - !reference [.rules, rules_main]

sast:
  rules:
    - !reference [.rules, rules_mr]

sast-report:
  rules:
    - !reference [.rules, rules_mr]

sca:
  rules:
    - !reference [.rules, rules_mr]

sca-report:
  rules:
    - !reference [.rules, rules_mr]

build_node:
  stage: build
  tags:
    - kubernetes-mid
  image: registry.sberdevices.ru/rndml/devops/dockerfiles/nodejs-runtime-22-21-1:latest
  rules:
    - !reference [.rules, rules_mr]
    - !reference [.rules, rules_main]
    - !reference [.rules, rules_tag]
  dependencies:
    - get_version
  script:
    - export NODE_OPTIONS="--max-old-space-size=4096"
    #- export VITE_TURNSTILE_SITE_KEY="0x4AAAAAABNk5YHsbWglDFid"
    - npm config set registry https://nexus.sberdevices.ru/repository/npm-proxy/
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist
    when: always
    expire_in: 2 weeks

docker_kaniko:
  extends: .kaniko
  rules:
    - !reference [.rules, rules_mr]
    - !reference [.rules, rules_main]
    - !reference [.rules, rules_tag]
  dependencies:
    - get_version
    - build_node

dast-zap-scan:
  extends: .dast-zap-graphql-apiscan
  rules:
    - !reference [.rules, rules_schedule]

dast-reports:
  extends: .dast-push-zap-report
  rules:
    - !reference [.rules, rules_schedule]

container-security:
  before_script:
  - apt update && apt install -y unzip
  - 'curl --location --output artifacts.zip --header "JOB-TOKEN: $CI_JOB_TOKEN" "https://git.sberdevices.ru/api/v4/projects/$CI_PROJECT_ID/jobs/artifacts/main/download?job=docker_kaniko"'
  - unzip -o artifacts.zip
  - cat dockerimage
  - CLOUD_CONTAINER_SECURITY_IMAGE=`cat dockerimage`
  rules:
    - !reference [.rules, rules_schedule]
  needs: []

container-security-report:
  rules:
    - !reference [.rules, rules_schedule]
